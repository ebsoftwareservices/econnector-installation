name: Release the application
on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Input the release tag'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.releaseTag }}

jobs:
  build-jsvc:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Build jsvc
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf gcc make
          curl -fsSL -o commons-daemon-src.tar.gz \
            https://archive.apache.org/dist/commons/daemon/source/commons-daemon-1.3.4-src.tar.gz
          tar xzf commons-daemon-src.tar.gz
          cd commons-daemon-1.3.4-src/src/native/unix
          sh support/buildconf.sh
          ./configure --with-java="$JAVA_HOME"
          make
          mkdir -p "$GITHUB_WORKSPACE/linux/bin"
          cp jsvc "$GITHUB_WORKSPACE/linux/bin/jsvc-${{ matrix.arch }}"

      - name: Upload jsvc binary
        uses: actions/upload-artifact@v4
        with:
          name: jsvc-${{ matrix.arch }}
          path: linux/bin/jsvc-${{ matrix.arch }}

  release:
    needs: build-jsvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Changelog
        uses: scottbrenner/generate-changelog-action@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}

      - name: Download jsvc binaries
        uses: actions/download-artifact@v4
        with:
          pattern: jsvc-*
          path: linux/bin
          merge-multiple: true

      - name: Download Daemon Release
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-daemon'
          latest: true
          fileName: 'econnector-daemon.zip'
          out-file-path: linux/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Download Keysafe Release
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-daemon-keysafe'
          latest: true
          fileName: 'econnector-daemon-keysafe.zip'
          out-file-path: linux/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Download UI Release
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-ui'
          latest: true
          fileName: 'econnector-ui.zip'
          out-file-path: files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Build Windows Zip File
        run: |
          rm -rf files/econnector-*.zip .git* *.md upgrade.bat linux
          zip -r econnector-installation.zip .

      - name: Build Linux Tarball
        run: |
          chmod +x linux/*.sh
          tar -czf econnector-installation-linux.tar.gz -C linux .

      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: Release ${{ env.RELEASE_TAG }}
          body: |
            ${{ steps.Changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./econnector-installation.zip
          asset_name: econnector-installation.zip
          asset_content_type: application/zip

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./econnector-installation-linux.tar.gz
          asset_name: econnector-installation-linux.tar.gz
          asset_content_type: application/gzip
