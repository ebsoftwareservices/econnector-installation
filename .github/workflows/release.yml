name: Release the application
on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Input the release tag'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.releaseTag }}

jobs:
  build-jsvc:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Build jsvc
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf gcc make unzip
          curl -fsSL -o commons-daemon-src.zip \
            https://archive.apache.org/dist/commons/daemon/source/commons-daemon-1.6.1-src.zip
          unzip -q commons-daemon-src.zip
          cd commons-daemon-1.6.1-src/src/native/unix
          sh support/buildconf.sh
          ./configure --with-java="$JAVA_HOME"
          make
          mkdir -p "$GITHUB_WORKSPACE/linux/bin"
          cp jsvc "$GITHUB_WORKSPACE/linux/bin/jsvc-${{ matrix.arch }}"

      - name: Upload jsvc binary
        uses: actions/upload-artifact@v7
        with:
          name: jsvc-${{ matrix.arch }}
          path: linux/bin/jsvc-${{ matrix.arch }}

  build-packages:
    needs: build-jsvc
    strategy:
      matrix:
        environment:
          - staging
          - prod
    runs-on: ubuntu-latest
    env:
      DAEMON_RELEASE_FILE: econnector-daemon-${{ matrix.environment }}.zip
    steps:
      - uses: actions/checkout@v6

      - name: Download jsvc binaries
        uses: actions/download-artifact@v8
        with:
          pattern: jsvc-*
          path: linux/bin
          merge-multiple: true

      - name: Prepare environment-specific payload directories
        run: |
          rm -rf linux/files windows/files
          mkdir -p linux/files windows/files

      - name: Download Daemon Release for Linux
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-daemon'
          latest: true
          fileName: ${{ env.DAEMON_RELEASE_FILE }}
          out-file-path: linux/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Download Keysafe Release
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-daemon-keysafe'
          latest: true
          fileName: 'econnector-daemon-keysafe.zip'
          out-file-path: linux/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Download Daemon Release for Windows
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-daemon'
          latest: true
          fileName: ${{ env.DAEMON_RELEASE_FILE }}
          out-file-path: windows/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Download UI Release for Windows
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ebsoftwareservices/econnector-ui'
          latest: true
          fileName: 'econnector-ui.zip'
          out-file-path: windows/files
          extract: true
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Build Linux Tarball
        run: |
          chmod +x linux/*.sh
          rm -f linux/files/econnector-*.zip
          tar -czf econnector-installation-linux-${{ matrix.environment }}.tar.gz -C linux .

      - name: Build Windows Zip File
        run: |
          rm -f windows/files/econnector-*.zip
          (cd windows && zip -r ../econnector-installation-win-${{ matrix.environment }}.zip .)

      - name: Upload installation packages
        uses: actions/upload-artifact@v7
        with:
          name: econnector-installation-${{ matrix.environment }}
          path: |
            econnector-installation-linux-${{ matrix.environment }}.tar.gz
            econnector-installation-win-${{ matrix.environment }}.zip

  release:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Changelog
        uses: scottbrenner/generate-changelog-action@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}

      - name: Download installation packages
        uses: actions/download-artifact@v8
        with:
          pattern: econnector-installation-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            ${{ steps.Changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            dist/econnector-installation-linux-staging.tar.gz
            dist/econnector-installation-linux-prod.tar.gz
            dist/econnector-installation-win-staging.zip
            dist/econnector-installation-win-prod.zip
